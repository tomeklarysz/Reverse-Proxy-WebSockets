# Local replica of the VPS: the same nginx/default.conf (mTLS) in front of vps.py.
# Nginx shares the broker's network namespace, so proxy_pass http://127.0.0.1:8080/8765
# works exactly like on the VPS. Exposed on https://127.0.0.1:8443.
#
#   python demo/setup_local_certs.py            # once
#   $env:TUNNEL_TOKEN = "..."; docker compose -f demo/docker-compose.yml up
services:
  broker:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -q --disable-pip-version-check --root-user-action=ignore websockets && python -u vps.py --host 127.0.0.1"
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN before starting the demo}
    volumes:
      - ../vps.py:/app/vps.py:ro
    ports:
      - "127.0.0.1:8443:443"

  nginx:
    image: nginx:1.27-alpine
    network_mode: "service:broker"
    depends_on:
      - broker
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
      - ./certs/ca.crt:/etc/nginx/certs/ca.crt:ro
